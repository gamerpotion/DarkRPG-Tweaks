name: Fabric Loom build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Verify source datapacks and build Fabric mod
        run: gradle clean build --no-daemon --console plain
      - uses: actions/upload-artifact@v4
        with:
          name: DarkRPG-Tweaks-1.0.0-beta.2
          path: build/libs/*.jar
